<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Roberto Minghi</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.5rem;
        padding: 2rem;
        background: #0f172a;
        color: #f8fafc;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
        max-width: 42ch;
        color: #94a3b8;
        line-height: 1.6;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 4px;
        background: #22c55e;
        color: #0f172a;
        font-size: 0.875rem;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f8fafc;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p style="color: #22c55e">404</p>
    <h1>Page not found</h1>
    <p lang="en">The page you are looking for does not exist or has moved.</p>
    <p lang="it">La pagina che cerchi non esiste o è stata spostata.</p>
    <div class="links">
      <a href="/en/" hreflang="en">Homepage</a>
      <a href="/it/" hreflang="it">Pagina iniziale</a>
    </div>
  </body>
</html>
